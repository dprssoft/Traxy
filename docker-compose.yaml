services:
  caddy:
    image: caddy:alpine
    container_name: caddy-gateway
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: track-list-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - frontend/.env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: on-failure

volumes:
  caddy_data:
  caddy_config:
